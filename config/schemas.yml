schemas:
  dim_people:
    columns:
      person_id:
        type: uuid
        primary_key: true
      name:
        type: text
        not_null: true
        source: name
      age:
        type: int
        not_null: true
        source: age
      gender:
        type: text
        not_null: true
        source: gender
      blood_type:
        type: text
        not_null: true
        source: blood_type

  dim_hospitals:
    columns:
      hospital_id:
        type: int
        primary_key: true
      hospital_name:
        type: text
        not_null: true
        source: hospital

  dim_doctors:
    columns:
      doctor_id:
        type: int
        primary_key: true
      doctor_name:
        type: text
        not_null: true
        source: doctor
      hospital_id:
        type: int
        not_null: true
        references:
          table: dim_hospitals
          column: hospital_id

  dim_conditions:
    columns:
      condition_id:
        type: int
        primary_key: true
      condition_name:
        type: text
        not_null: true
        source: medical_condition

  dim_insurance:
    columns:
      insurance_id:
        type: int
        primary_key: true
      provider_name:
        type: text
        not_null: true
        source: insurance_provider

  dim_test_results:
    columns:
      test_result_id:
        type: int
        primary_key: true
      result_label:
        type: text
        not_null: true
        check: "result_label IN ('inconclusive', 'normal', 'abnormal')"
        source: test_results

  dim_admission_types:
    columns:
      admission_type_id:
        type: int
        primary_key: true
      type_name:
        type: text
        not_null: true
        source: admission_type

  fact_admission_data:
    columns:
      admission_id:
        type: int
        primary_key: true
      person_id:
        type: uuid
        not_null: true
        references:
          table: dim_people
          column: person_id
      doctor_id:
        type: int
        not_null: true
        references:
          table: dim_doctors
          column: doctor_id
      condition_id:
        type: int
        not_null: true
        references:
          table: dim_conditions
          column: condition_id
      insurance_id:
        type: int
        not_null: true
        references:
          table: dim_insurance
          column: insurance_id
      admission_type_id:
        type: int
        not_null: true
        references:
          table: dim_admission_types
          column: admission_type_id
      test_result_id:
        type: int
        not_null: true
        references:
          table: dim_test_results
          column: test_result_id
      date_of_admission:
        type: date
        source: date_of_admission
      discharge_date:
        type: date
        source: discharge_date
      billing_amount:
        type: numeric(12, 2)
        source: billing_amount
      room_number:
        type: int
        source: room_number
      medication:
        type: text
        not_null: true
        source: medication

  stg_rejects:
    columns:
      reject_id:
        type: serial
        primary_key: true
      name:
        type: text
      age:
        type: text
      gender:
        type: text
      blood_type:
        type: text
      medical_condition:
        type: text
      date_of_admission:
        type: text
      doctor:
        type: text
      hospital:
        type: text
      insurance_provider:
        type: text
      billing_amount:
        type: text
      room_number:
        type: text
      admission_type:
        type: text
      discharge_date:
        type: text
      medication:
        type: text
      test_results:
        type: text
      missing_columns:
        type: text
        not_null: true

  stg_admissions:
    columns:
      stg_id:
        type: bigserial
        primary_key: true
      name:
        type: text
        not_null: true
        source: name
      age:
        type: int
        source: age
      gender:
        type: text
        source: gender
      blood_type:
        type: text
        source: blood_type
      medical_condition:
        type: text
        source: medical_condition
      date_of_admission:
        type: date
        source: date_of_admission
      doctor:
        type: text
        source: doctor
      hospital:
        type: text
        source: hospital
      insurance_provider:
        type: text
        source: insurance_provider
      billing_amount:
        type: numeric(12, 2)
        source: billing_amount
      room_number:
        type: int
        source: room_number
      admission_type:
        type: text
        source: admission_type
      discharge_date:
        type: date
        source: discharge_date
      medication:
        type: text
        source: medication
      test_results:
        type: text
        source: test_results